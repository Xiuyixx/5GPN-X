name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck -x install.sh quick-install.sh lib/common.sh lib/dns.sh lib/cert.sh lib/services.sh lib/exits.sh lib/rules.sh lib/uninstall.sh lib/update-rules.sh lib/renew-hook.sh
          shellcheck -x tests/*.sh
      - name: Python compile + ruff
        run: |
          python3 -m py_compile lib/*.py
          pipx run ruff==0.15.20 check lib/ tests/

  shell-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run shell test suite
        run: |
          for t in tests/*.sh; do
            echo "RUN $t"
            sudo -E bash "$t"
          done
      - name: Run python test suite
        run: |
          for t in tests/*.py; do
            echo "RUN $t"
            python3 "$t"
          done

  # Cross-distro coverage: install.sh claims Debian + RHEL-family support, so
  # run the hermetic policy tests inside apt-based and dnf-based containers.
  distro-matrix-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        container: ["debian:12", "rockylinux:9"]
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test deps
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends python3 procps systemd
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y python3 procps systemd
          fi
      - name: Run shell test suite
        run: |
          set -e
          for t in tests/*.sh; do
            echo "RUN $t"
            bash "$t"
          done
      - name: Run python test suite
        run: |
          set -e
          for t in tests/*.py; do
            echo "RUN $t"
            python3 "$t"
          done

  powershell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell policy tests
        run: |
          for t in tests/*.ps1; do
            echo "RUN $t"
            pwsh -NoProfile -File "$t"
          done

  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Test quic-proxy
        run: |
          set -euo pipefail
          for prog in quic-proxy; do
            dir="$(mktemp -d)"
            cp "lib/${prog}.go" "lib/${prog}_test.go" "$dir/"
            (cd "$dir" && go mod init "$prog" >/dev/null && go vet ./... && go test ./...)
          done
